
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Management System | Login</title>

    <!-- Application favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="login-body">

    <main class="login-wrapper">

        <section class="login-brand">
            <div class="brand-icon">PDF</div>

            <h1>PDF Management System</h1>

            <p>
                Inspect, compress and manage your PDF documents
                from one secure workspace.
            </p>

            <div class="login-feature-list">
                <div>✓ PDF inspection</div>
                <div>✓ Intelligent compression</div>
                <div>✓ Document history</div>
                <div>✓ Secure file management</div>
            </div>
        </section>

        <section class="login-card">

            <div class="login-heading">
                <span class="eyebrow">WELCOME BACK</span>

                <h2>Sign in</h2>

                <p>
                    Enter your account credentials to continue.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div id="loginMessage" class="message"></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button login-button"
                >
                    Sign In
                </button>

            </form>

            <p class="login-footer">
                PDF Management System
                <span>•</span>
                Secure workspace
            </p>

        </section>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            loginMessage.textContent = "";
            loginMessage.className = "message";

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Login failed."
                    );
                }

                window.location.href = "/dashboard";

            } catch (error) {
                loginMessage.textContent = error.message;
                loginMessage.classList.add("error");

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
            }
        });
    </script>

</body>
</html>
